# 상상톡 운영(폐쇄망) — 2대 구성의 ② WAS·DB 서버: Zulip + PostgreSQL + RabbitMQ + Redis + Memcached.
# ① 웹 서버(nginx + 상상톡 웹 서버)는 ops/nginx, ops/systemd 참고. 전체 안내는 ops/README.md.
#
# 실행(② 서버에서, 저장소 루트 기준):
#   docker compose --env-file /etc/sangsangtalk/zulip.env -f ops/compose/compose.was-db.yaml up -d
# --env-file을 주지 않으면 compose는 이 파일이 있는 ops/compose/.env를 읽는다.
# 필요한 값(.env.example 참고): ZULIP__* 비밀값 6개, ZULIP_EXTERNAL_HOST, ZULIP_ADMINISTRATOR,
#   ZULIP_APP_BIND_ADDRESS, ZULIP_DB_TLS_DIR, ZULIP_DB_CA_FILE, (선택) ZULIP_HTTPS_PORT.
#
# 프로젝트 이름을 개발용 compose.yaml과 같은 "sangsangtalk"으로 고정해
# 볼륨 이름(sangsangtalk_zulip, sangsangtalk_postgresql-14 등)과 비밀값 이름이 개발 환경과 같게 유지된다.
#
# DB(M10): PostgreSQL은 44703에서 듣고 TLS만 받는다(pg_hba: hostnossl 거부, hostssl만 비밀번호 인증).
#   DB 포트는 호스트에 publish하지 않는다(compose 내부망에서 zulip만 접속).
#   ZULIP_DB_TLS_DIR(호스트 폴더, 0700 root)에 server.crt / server.key(0600 root)를 둔다.
#     인증서 SAN에 "database"(compose 서비스 이름)가 있어야 한다: ops/pki/make-internal-ca.sh --db database
#   컨테이너가 시작할 때 키를 postgres 소유 0600으로 복사해 쓴다(호스트의 uid와 무관).
#   Zulip은 sslmode=verify-full 로 접속하며 ZULIP_DB_CA_FILE(내부 CA 루트, PEM)로 DB 인증서를 검증한다.
#
# Zulip HTTPS: CERTIFICATES=manual. 서버 인증서를 zulip 볼륨의
#   /data/certs/manual/zulip.key, /data/certs/manual/zulip.combined-chain.crt 에 넣는다(ops/pki/README.md).
#
# 메일(M12): 내부 메일 서버가 없다. EMAIL_HOST를 주지 않아 Zulip은 메일을 보내지 않는다(dummy 백엔드).
#   메일에 기대는 기능은 아래 설정과 조직 설정으로 끈다(ops/README.md "M12").
#
# SELinux(Rocky 9): 바인드 마운트에 :z 를 붙이고, /etc/sangsangtalk/pki 에는 semanage fcontext 로
#   container_file_t 영구 라벨 규칙을 등록한다(restorecon 뒤에도 유지. ops/rocky9.md, ops/pki/README.md).

name: sangsangtalk

secrets:
  zulip__postgres_password:
    environment: "ZULIP__POSTGRES_PASSWORD"
  zulip__memcached_password:
    environment: "ZULIP__MEMCACHED_PASSWORD"
  zulip__rabbitmq_password:
    environment: "ZULIP__RABBITMQ_PASSWORD"
  zulip__redis_password:
    environment: "ZULIP__REDIS_PASSWORD"
  zulip__secret_key:
    environment: "ZULIP__SECRET_KEY"
  zulip__email_password:
    environment: "ZULIP__EMAIL_PASSWORD"

services:
  database:
    image: "zulip/zulip-postgresql:14"
    restart: unless-stopped
    # ports 없음: 2대 구성에서는 DB를 호스트에 publish하지 않는다.
    command:
      - "sh"
      - "-euc"
      - |
        d=/run/sangsangtalk-pg
        install -d -o postgres -g postgres -m 0700 "$$d"
        install -o postgres -g postgres -m 0600 /run/pg-tls/server.key "$$d/server.key"
        install -o postgres -g postgres -m 0644 /run/pg-tls/server.crt "$$d/server.crt"
        printf '%s\n' \
          '# 상상톡: 컨테이너 안 소켓은 이미지 기본(trust)과 같고, TCP는 TLS만 허용한다.' \
          'local      all  all       trust' \
          'hostnossl  all  all  all  reject' \
          'hostssl    all  all  all  scram-sha-256' > "$$d/pg_hba.conf"
        chown postgres:postgres "$$d/pg_hba.conf"
        chmod 0600 "$$d/pg_hba.conf"
        exec docker-entrypoint.sh postgres \
          -c port="$$PGPORT" \
          -c ssl=on \
          -c ssl_cert_file="$$d/server.crt" \
          -c ssl_key_file="$$d/server.key" \
          -c ssl_min_protocol_version=TLSv1.2 \
          -c hba_file="$$d/pg_hba.conf"
    secrets:
      - zulip__postgres_password
    environment:
      POSTGRES_DB: "zulip"
      POSTGRES_USER: "zulip"
      POSTGRES_PASSWORD_FILE: /run/secrets/zulip__postgres_password
      # 서버 포트와 컨테이너 안 psql 기본 포트(초기화 스크립트 포함)
      PGPORT: "44703"
    volumes:
      - "postgresql-14:/var/lib/postgresql/data:rw"
      - "${ZULIP_DB_TLS_DIR:?ZULIP_DB_TLS_DIR (DB 인증서 폴더: server.crt, server.key)를 지정하세요}:/run/pg-tls:ro,z"

  memcached:
    image: "memcached:alpine"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$(cat $$MEMCACHED_PASSWORD_FILE)" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$(cat $$MEMCACHED_PASSWORD_FILE)" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    secrets:
      - zulip__memcached_password
    environment:
      SASL_CONF_PATH: "/home/memcache/memcached.conf"
      MEMCACHED_SASL_PWDB: "/home/memcache/memcached-sasl-db"
      MEMCACHED_PASSWORD_FILE: /run/secrets/zulip__memcached_password

  rabbitmq:
    image: "rabbitmq:4.2"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat $$RABBITMQ_PASSWORD_FILE)"
        echo "default_user = $$RABBITMQ_DEFAULT_USER" >> /etc/rabbitmq/rabbitmq.conf
        echo "default_pass = $$RABBITMQ_DEFAULT_PASS" >> /etc/rabbitmq/rabbitmq.conf
        exec docker-entrypoint.sh rabbitmq-server
    secrets:
      - zulip__rabbitmq_password
    environment:
      RABBITMQ_DEFAULT_USER: "zulip"
      RABBITMQ_PASSWORD_FILE: /run/secrets/zulip__rabbitmq_password
    volumes:
      - "rabbitmq:/var/lib/rabbitmq:rw"

  redis:
    image: "redis:alpine"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - '/usr/local/bin/docker-entrypoint.sh --requirepass "$$(cat $$REDIS_PASSWORD_FILE)"'
    secrets:
      - zulip__redis_password
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/zulip__redis_password
    volumes:
      - "redis:/data:rw"

  zulip:
    image: "ghcr.io/zulip/zulip-server:12.3-0"
    restart: unless-stopped
    ports:
      # ① 웹 서버와 관리자 PC만 접근하도록 방화벽(DOCKER-USER)으로 제한한다(ops/firewall.md).
      # ZULIP_APP_BIND_ADDRESS: ② 서버의 내부 IP. 0.0.0.0 대신 명시한다.
      - "${ZULIP_APP_BIND_ADDRESS:?ZULIP_APP_BIND_ADDRESS (② 서버 내부 IP, 예 10.0.20.10)를 지정하세요}:${ZULIP_HTTPS_PORT:-443}:443"
    secrets:
      - zulip__postgres_password
      - zulip__memcached_password
      - zulip__rabbitmq_password
      - zulip__redis_password
      - zulip__secret_key
      - zulip__email_password
    environment:
      # --- 서비스 위치 ---
      SETTING_REMOTE_POSTGRES_HOST: "database"
      SETTING_REMOTE_POSTGRES_PORT: "44703"
      # M10: DB 인증서를 내부 CA로 검증하고 이름(database)까지 확인한다.
      # docker-zulip 12.3 entrypoint 기본값은 prefer(→ Django DATABASES OPTIONS sslmode).
      SETTING_REMOTE_POSTGRES_SSLMODE: "verify-full"
      # Django 밖의 libpq 도구(manage.py backup의 pg_dump, entrypoint의 pg_isready·psql)도 같은 기준을 쓰게 한다.
      PGSSLMODE: "verify-full"
      PGSSLROOTCERT: "/etc/sangsangtalk/db-ca.crt"
      SETTING_MEMCACHED_LOCATION: "memcached:11211"
      SETTING_RABBITMQ_HOST: "rabbitmq"
      SETTING_REDIS_HOST: "redis"
      SETTING_EXTERNAL_HOST: "${ZULIP_EXTERNAL_HOST:?ZULIP_EXTERNAL_HOST (예 zulip.eumseong.local)를 지정하세요}"
      SETTING_ZULIP_ADMINISTRATOR: "${ZULIP_ADMINISTRATOR:?ZULIP_ADMINISTRATOR (관리자 이메일)를 지정하세요}"
      CERTIFICATES: "manual"
      CONFIG_application_server__queue_workers_multiprocess: "false"
      # 이미지 자체 자동 백업을 끄고 ops/backup.sh로 일원화한다.
      AUTO_BACKUP_ENABLED: "False"
      # 2단계 A2 한국어 검색: 기본 전문 검색은 단어 단위라 "회의자료"로 "회의자료를"을 못 찾는다.
      # PGroonga는 단어 안쪽 일부도 찾는다. 확장은 database(zulip/zulip-postgresql:14) 이미지가 DB를 처음 만들 때 설치한다.
      # 처음 켜고 시작할 때 pgroonga 마이그레이션이 기존 메시지 전체의 검색 열을 채운다(ops/README.md "2단계").
      SETTING_USING_PGROONGA: "True"

      # --- M6: 폐쇄망 외부 접속 끄기 (근거·출처: ops/README.md) ---
      SETTING_ZULIP_SERVICES_URL: "None"
      SETTING_ZULIP_SERVICE_PUSH_NOTIFICATIONS: "False"
      SETTING_ZULIP_SERVICE_SUBMIT_USAGE_STATISTICS: "False"
      SETTING_ZULIP_SERVICE_SECURITY_ALERTS: "False"
      SETTING_ENABLE_GRAVATAR: "False"
      SETTING_INLINE_URL_EMBED_PREVIEW: "False"
      SETTING_JITSI_SERVER_URL: "None"
      SETTING_NAVIGATION_TOUR_VIDEO_URL: "None"
      SETTING_PROMOTE_SPONSORING_ZULIP: "False"

      # --- M12: 메일 없이 운영 (근거: ops/README.md) ---
      # EMAIL_HOST를 설정하지 않는다 → dummy 백엔드(메일을 보내지 않음, 관리자 화면에 경고).
      # 새 기기 로그인 알림 메일 끔
      SETTING_SEND_LOGIN_EMAILS: "False"
      # 요약(digest) 메일 끔(서버 전체)
      SETTING_SEND_DIGEST_EMAILS: "False"
    volumes:
      - "zulip:/data:rw"
      - "${ZULIP_DB_CA_FILE:?ZULIP_DB_CA_FILE (DB 인증서를 발급한 CA 루트, PEM)를 지정하세요}:/etc/sangsangtalk/db-ca.crt:ro,z"
      # 같은 CA를 libpq 기본 위치(~/.postgresql/root.crt)에도 둔다. 이미지 안 cron(manage.py clearsessions 등)은
      # 컨테이너 환경변수(PGSSLROOTCERT)를 받지 못할 수 있으므로, 환경변수 없이도 verify-full이 되게 한다.
      - "${ZULIP_DB_CA_FILE}:/home/zulip/.postgresql/root.crt:ro,z"
      - "${ZULIP_DB_CA_FILE}:/root/.postgresql/root.crt:ro,z"
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    depends_on:
      - database
      - memcached
      - rabbitmq
      - redis

volumes:
  zulip:
  postgresql-14:
  rabbitmq:
  redis:
