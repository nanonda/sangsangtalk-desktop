# 상상톡 운영(폐쇄망) — 3계층 구성의 [DB] 계층: PostgreSQL 14만.
# 기본 운영은 2대 구성(compose.was-db.yaml)이다. 이 파일은 보안성 검토에서 DB 서버 분리를 요구할 때 쓴다.
#
# 실행(DB 서버에서, 저장소 루트 기준):
#   docker compose --env-file /etc/sangsangtalk/zulip.env -f ops/compose/compose.db.yaml up -d
# 필요한 값: ZULIP__POSTGRES_PASSWORD (앱 서버와 같은 값), ZULIP_DB_BIND_ADDRESS (DB 서버 내부 IP),
#   ZULIP_DB_TLS_DIR (DB 인증서 폴더: server.crt, server.key).
#
# 프로젝트 이름 "sangsangtalk" → 볼륨 이름 sangsangtalk_postgresql-14 (개발용 compose.yaml과 같음).
#
# DB(M10): 44703에서 듣고 TLS만 받는다(pg_hba: hostnossl 거부, hostssl만 비밀번호 인증).
#   DB 인증서 SAN에 앱 서버가 접속하는 이름(ZULIP_DB_HOST 값, DNS 이름 또는 IP)이 있어야 한다
#   (앱은 sslmode=verify-full). 예: ops/pki/make-internal-ca.sh --db db.eumseong.local,10.0.30.10
#   컨테이너가 시작할 때 키를 postgres 소유 0600으로 복사해 쓴다(호스트의 uid와 무관).
#
# !! 44703은 [앱] 서버에서만 접속할 수 있어야 한다. !!
#   - ZULIP_DB_BIND_ADDRESS로 내부 NIC 주소에만 바인딩하고, DOCKER-USER 체인(IPv4·IPv6)으로 앱 서버 IP만 허용한다
#     (Docker가 publish한 포트는 firewalld의 INPUT 규칙을 우회한다. ops/firewall.md).
#   - pg_hba는 출발지 주소를 제한하지 않는다(TLS + 비밀번호). 출발지 제한은 방화벽이 맡는다.

name: sangsangtalk

secrets:
  zulip__postgres_password:
    environment: "ZULIP__POSTGRES_PASSWORD"

services:
  database:
    image: "zulip/zulip-postgresql:14"
    restart: unless-stopped
    ports:
      # ZULIP_DB_BIND_ADDRESS: 이 DB 서버의 내부 IP(앱 서버와 통하는 NIC, 예 10.0.30.10). 필수 — 0.0.0.0에 열지 않는다.
      - "${ZULIP_DB_BIND_ADDRESS:?ZULIP_DB_BIND_ADDRESS (DB 서버 내부 IP, 예 10.0.30.10)를 지정하세요}:44703:44703"
    command:
      - "sh"
      - "-euc"
      - |
        d=/run/sangsangtalk-pg
        install -d -o postgres -g postgres -m 0700 "$$d"
        install -o postgres -g postgres -m 0600 /run/pg-tls/server.key "$$d/server.key"
        install -o postgres -g postgres -m 0644 /run/pg-tls/server.crt "$$d/server.crt"
        printf '%s\n' \
          '# 상상톡: 컨테이너 안 소켓은 이미지 기본(trust)과 같고, TCP는 TLS만 허용한다.' \
          'local      all  all       trust' \
          'hostnossl  all  all  all  reject' \
          'hostssl    all  all  all  scram-sha-256' > "$$d/pg_hba.conf"
        chown postgres:postgres "$$d/pg_hba.conf"
        chmod 0600 "$$d/pg_hba.conf"
        exec docker-entrypoint.sh postgres \
          -c port="$$PGPORT" \
          -c ssl=on \
          -c ssl_cert_file="$$d/server.crt" \
          -c ssl_key_file="$$d/server.key" \
          -c ssl_min_protocol_version=TLSv1.2 \
          -c hba_file="$$d/pg_hba.conf"
    secrets:
      - zulip__postgres_password
    environment:
      POSTGRES_DB: "zulip"
      POSTGRES_USER: "zulip"
      POSTGRES_PASSWORD_FILE: /run/secrets/zulip__postgres_password
      PGPORT: "44703"
    volumes:
      - "postgresql-14:/var/lib/postgresql/data:rw"
      - "${ZULIP_DB_TLS_DIR:?ZULIP_DB_TLS_DIR (DB 인증서 폴더: server.crt, server.key)를 지정하세요}:/run/pg-tls:ro,z"

volumes:
  postgresql-14:
