# 상상톡 [웹] 계층 nginx 설정: 직원 PC ──HTTPS 443──▶ nginx ──▶ 상상톡 웹 서버(Node, 127.0.0.1:43123)
#
# 설치(예: Debian/Ubuntu/RHEL 계열):
#   /etc/nginx/conf.d/sangsangtalk.conf 로 복사 → server_name·인증서 경로 수정 → nginx -t → systemctl reload nginx
# 이 파일은 http { } 블록 안에 include 되는 것을 전제로 한다(conf.d 기본 동작).
#
# 상상톡 웹 서버 쪽 설정(/etc/sangsangtalk/web.env, ops/systemd/sangsangtalk-web.service 참고):
#   HOST=127.0.0.1  PORT=43123  PUBLIC_ORIGIN=https://talk.eumseong.local  MAX_UPLOAD_MB=100
#   Origin 검사는 PUBLIC_ORIGIN 기준이며 X-Forwarded-Host·Proto 는 쓰지 않는다.
#   X-Forwarded-For 는 감사 로그(web/data/audit) IP 에만 쓴다: PUBLIC_ORIGIN 이 있고 요청이 127.0.0.1·::1 에서 왔을 때
#   마지막 값(= nginx 가 덧붙인 $remote_addr)을 쓴다. 직원 PC가 보낸 X-Forwarded-For 는 앞쪽에 남을 뿐 쓰이지 않는다.
#
# 포트 43123을 바꾸면 아래 upstream 과 web.env 의 PORT 를 함께 바꾼다.
# 브라우저는 Zulip을 직접 부르지 않는다. 이 nginx는 Zulip(앱 서버)으로 프록시하지 않는다.

upstream sangsangtalk_web {
    server 127.0.0.1:43123;
    keepalive 16;
}

# (선택) 80 → 443 리다이렉트. 방화벽에서 80을 열지 않으면 필요 없다(ops/firewall.md).
# server {
#     listen 80;
#     listen [::]:80;
#     server_name talk.eumseong.local;
#     return 301 https://$host$request_uri;
# }

server {
    # nginx 1.24 이하(Ubuntu 24.04·RHEL 9 기본 패키지)와 호환되는 형식. 1.25.1 이상에서는 경고만 나오며,
    # 원하면 "listen 443 ssl;" + "http2 on;" 으로 바꾼다.
    listen 443 ssl http2;
    # IPv6가 꺼진 커널(ipv6.disable=1)이면 아래 줄 때문에 nginx가 시작하지 못한다. 그때는 이 줄을 지운다.
    listen [::]:443 ssl http2;
    server_name talk.eumseong.local;  # 운영 도메인으로 바꾼다(PUBLIC_ORIGIN과 같아야 함)

    # --- TLS: 기관 내부 CA가 발급한 인증서(전체 체인) ---
    # /etc/sangsangtalk/tls/ 는 nginx 전용(0700 root, 키 0600 root). Node가 읽는 CA는 /etc/sangsangtalk/ca/ 로 분리한다.
    ssl_certificate     /etc/sangsangtalk/tls/talk.fullchain.pem;
    ssl_certificate_key /etc/sangsangtalk/tls/talk.key;
    # Mozilla SSL Configuration Guidelines 6.0 "intermediate" (https://ssl-config.mozilla.org/guidelines/latest.json)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;   # intermediate 권고: 클라이언트 선호 순서 사용
    ssl_ecdh_curve X25519:prime256v1:secp384r1;   # Mozilla 목록의 X25519MLKEM768은 OpenSSL 3.5 이상에서만 지원되어 뺐다
    ssl_session_timeout 1d;
    ssl_session_cache shared:SangsangTLS:10m;
    ssl_session_tickets off;

    # --- 보안 헤더 (always: 오류 응답에도 붙임) ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP는 UI(web/public)와 데스크톱 웹뷰에서 실제로 확인한 뒤 켠다(확인 필요). 초안:
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    # 주의: location 안에서 add_header 를 쓰면 위 헤더가 그 location 에 상속되지 않는다. location 에는 add_header 를 두지 않는다.

    server_tokens off;
    access_log /var/log/nginx/sangsangtalk.access.log;
    error_log  /var/log/nginx/sangsangtalk.error.log warn;

    # 일반 요청: JSON 본문은 웹 서버가 64KB로 제한한다.
    client_max_body_size 1m;

    # --- 공통 프록시 설정 ---
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;       # 클라이언트가 보낸 Host(포트 포함) 그대로. 웹 서버의 Host 비교(PUBLIC_ORIGIN 미설정 시)용
    proxy_set_header Connection "";         # upstream keepalive
    # 감사 로그 IP: 웹 서버가 마지막 값을 쓴다. $remote_addr 를 맨 뒤에 덧붙이는 이 형식을 바꾸지 않는다.
    # (location 안에 proxy_set_header 를 두면 이 줄들이 상속되지 않으므로 location 에는 두지 않는다.)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_redirect off;

    location / {
        proxy_pass http://sangsangtalk_web;
    }

    # 롱폴링: 웹 서버가 Zulip 이벤트 큐를 최대 55초 기다린 뒤 응답한다(+처리 시간).
    # 계약: 90초 이상. 넉넉히 120초로 두고, 응답을 버퍼링하지 않는다.
    location = /api/events {
        proxy_pass http://sangsangtalk_web;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # 파일 올리기(POST /api/files)·내려받기(GET /api/files/...).
    # 올리기: 웹 서버가 본문을 Zulip(tus)으로 그대로 흘려보내므로 nginx가 디스크에 모으지 않게 한다.
    #   client_max_body_size = MAX_UPLOAD_MB(기본 100) + 여유 1MB. 웹 서버가 Content-Length로 먼저 거르고
    #   한국어 오류("파일은 100MB까지…")를 돌려주므로 nginx 한도는 그보다 조금 크게 둔다.
    #   MAX_UPLOAD_MB를 바꾸면 이 값도 함께 바꾼다.
    # 내려받기: 큰 파일을 임시 파일로 모으지 않고 바로 흘려보낸다.
    location /api/files {
        proxy_pass http://sangsangtalk_web;
        client_max_body_size 101m;
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_timeout 300s;   # 업로드 중 두 번의 읽기 사이 최대 대기(느린 망 고려)
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;    # 업로드 완료 후 Zulip 저장·응답 대기 포함
    }
}
