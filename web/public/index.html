<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>상상톡</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="mode-login">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="emblem" viewBox="0 0 64 64">
        <clipPath id="emblem-clip"><circle cx="32" cy="32" r="32"/></clipPath>
        <g clip-path="url(#emblem-clip)">
          <rect width="64" height="64" fill="#0b4a9a"/>
          <path fill="#17988a" d="M0 36c12 2 24 6 34 4 12-3 20-2 30 1v23H0Z"/>
          <path fill="#fff" d="M0 30c9-3 19-2 28 0 7 2 14 2 22-2 5-2 10-2 14 0v5c-5-1-9 0-13 2-9 4-16 4-22 2-3-1-4 2-1 4 3 3 8 4 14 4-8 4-17 4-23 0-4-3-3-7 2-9-7-1-14-1-21 2Z"/>
          <circle cx="38" cy="17" r="6.4" fill="#f08a24"/>
        </g>
      </symbol>
      <symbol id="infinity" viewBox="0 0 76 40">
        <g fill="none" stroke-linecap="round">
          <path id="inf-path" d="M38 20C30 6 6 6 6 20s24 14 32 0 32-14 32 0-24 14-32 0Z" stroke="#149488" stroke-width="8"/>
          <use href="#inf-path" stroke="#fff" stroke-width="5.6"/>
          <use href="#inf-path" stroke="#149488" stroke-width="3.6"/>
          <use href="#inf-path" stroke="#fff" stroke-width="1.8"/>
        </g>
      </symbol>
      <symbol id="ico-group" viewBox="0 0 24 24"><circle cx="9.5" cy="8.5" r="3"/><path d="M3.8 19c.7-3.2 3-4.8 5.7-4.8s5 1.6 5.7 4.8"/><circle cx="17" cy="9.5" r="2.2"/><path d="M15.8 14.4c2 .1 3.6 1.4 4.2 4"/></symbol>
      <symbol id="ico-mail" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4.5 7.5 7.5 5.5 7.5-5.5"/></symbol>
      <symbol id="ico-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3ZM12 15v5"/></symbol>
    </defs>
  </svg>

  <main class="gate" id="login-view">
    <form class="card" id="login-form">
      <div class="brand-row">
        <svg class="login-emblem" role="img" aria-label="음성군"><use href="#emblem"/></svg>
        <div>
          <p class="brand-name"><svg class="brand-inf" aria-hidden="true"><use href="#infinity"/></svg>상상톡</p>
          <p class="brand-sub">음성군</p>
        </div>
      </div>
      <h1>로그인</h1>
      <p class="lede">이메일과 비밀번호로 들어옵니다.</p>
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required placeholder="name@localhost.localdomain">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="alert" role="alert"></p>
      <button id="login-button" class="button-primary" type="submit">로그인</button>
      <img class="login-turtle" src="/assets/turtle-thumbs.png" alt="">
    </form>
  </main>

  <div class="shell" id="chat-view" hidden>
    <!-- 1. 레일 -->
    <nav class="rail" aria-label="주 메뉴">
      <svg class="emblem" role="img" aria-label="음성군"><use href="#emblem"/></svg>
      <button type="button" class="rail-btn" id="rail-talk" data-view="talk">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5A2.5 2.5 0 0 1 7 4h10a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 17 16h-6l-4 3.5V16a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8.5 9h7M8.5 12h4.5"/></svg>대화<span class="badge" id="talk-badge" hidden></span>
      </button>
      <button type="button" class="rail-btn" id="rail-people" data-view="home">
        <svg class="i" aria-hidden="true"><use href="#ico-group"/></svg>직원
      </button>
      <button type="button" class="rail-btn" id="rail-notes" data-view="notes">
        <svg class="i" aria-hidden="true"><use href="#ico-mail"/></svg>쪽지
      </button>
      <button type="button" class="rail-btn" disabled title="준비 중">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.8 2.5 5.1 5.6.8-4 3.9.9 5.6-5-2.6-5 2.6.9-5.6-4-3.9 5.6-.8Z"/></svg>즐겨찾기
      </button>
      <div class="rail-spacer"></div>
      <button type="button" class="rail-btn" disabled title="준비 중">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 19.5a2 2 0 0 0 4 0"/></svg>알림
      </button>
      <button type="button" class="rail-btn" disabled title="준비 중">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4.9a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.4A7.5 7.5 0 0 0 7 6.4l-2.4-.9-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a7.5 7.5 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a7.5 7.5 0 0 0 2.6-1.5l2.4.9 2-3.4Z"/></svg>설정
      </button>
      <button type="button" class="rail-btn" id="logout">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7V5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4v-2"/><path d="M10 12h9"/><path d="M16 8.5 19.5 12 16 15.5"/></svg>로그아웃
      </button>
      <div class="me" id="me">
        <span class="me-pic" id="me-avatar"><img src="/assets/turtle-front.png" alt=""></span>
        <span class="dot" id="me-dot"></span>
        <span class="sr-only" id="me-name"></span>
      </div>
    </nav>

    <!-- 2. 목록 -->
    <section class="list" id="list-pane" aria-label="목록">
      <header class="list-head">
        <div class="brand"><svg class="brand-inf" aria-hidden="true"><use href="#infinity"/></svg><b>상상톡</b></div>
        <button type="button" class="icon-btn primary" id="new-talk" aria-label="새 대화 — 직원 선택" title="새 대화">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>
      <h2 class="list-title" id="list-title">대화</h2>
      <label class="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></svg>
        <span class="sr-only">검색</span>
        <input id="list-search" type="search" placeholder="대화방, 이름 검색" autocomplete="off">
      </label>
      <div class="chips" id="talk-chips" role="group" aria-label="대화 필터">
        <button type="button" class="chip" data-talk-filter="all" aria-pressed="true">전체</button>
        <button type="button" class="chip" data-talk-filter="unread" aria-pressed="false">안읽음<span class="n" id="chip-unread"></span></button>
        <button type="button" class="chip" data-talk-filter="group" aria-pressed="false">그룹</button>
        <button type="button" class="chip" data-talk-filter="dm" aria-pressed="false">1:1</button>
      </div>
      <div class="chips" id="note-chips" role="group" aria-label="쪽지 필터" hidden>
        <button type="button" class="chip" data-note-filter="all" aria-pressed="true">전체</button>
        <button type="button" class="chip" data-note-filter="received" aria-pressed="false">받은 쪽지</button>
        <button type="button" class="chip" data-note-filter="sent" aria-pressed="false">보낸 쪽지</button>
      </div>
      <p id="list-status" class="list-status" role="status"></p>
      <div class="rooms" id="talk-list"></div>
      <div class="rooms" id="staff-list" hidden></div>
      <div class="rooms" id="notes-list" hidden></div>
      <div class="hello">
        <img src="/assets/turtle-thumbs.png" alt="">
        <div><b id="hello-title">안녕하세요!</b><span id="hello-text"></span></div>
      </div>
    </section>

    <!-- 3. 대화창 -->
    <main class="chat" id="thread-pane" aria-label="대화">
      <header class="chat-head">
        <button type="button" id="thread-back" class="icon-btn back" aria-label="목록으로">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <span class="av" id="chat-avatar" aria-hidden="true" hidden></span>
        <div class="identity">
          <h1 id="channel-name">대화</h1>
          <p><span id="live-status" class="live" role="status"><i></i><span id="live-text">연결하는 중…</span></span><span id="channel-kicker"></span></p>
        </div>
      </header>
      <p id="history-note" class="history-note" hidden>최근 100개의 메시지만 표시합니다.</p>
      <div id="thread-empty" class="thread-empty">
        <img src="/assets/turtle-jump.png" alt="">
        <p id="thread-empty-text">왼쪽에서 대화를 선택하세요.</p>
      </div>
      <div id="log" class="log" role="log" aria-label="대화" data-state="loading" hidden></div>
      <div id="note-log" class="log" role="log" aria-label="쪽지" hidden></div>
      <form id="composer" class="composer" hidden>
        <label class="sr-only" for="composer-input">메시지</label>
        <textarea id="composer-input" rows="1" maxlength="10000" placeholder="메시지를 입력하세요" required></textarea>
        <div class="tools">
          <p id="send-error" class="alert" role="alert"></p>
          <span class="hint">Enter 전송 · Shift+Enter 줄바꿈</span>
          <button id="send-button" class="send" type="submit" disabled>
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4 9.5 14.5M20 4l-6.5 16-4-5.5L4 10.5Z"/></svg><span>전송</span>
          </button>
        </div>
      </form>
      <form id="note-composer" class="composer" hidden>
        <label class="sr-only" for="note-thread-input">쪽지</label>
        <textarea id="note-thread-input" rows="1" maxlength="10000" placeholder="쪽지를 입력하세요" required></textarea>
        <div class="tools">
          <p id="note-thread-error" class="alert" role="alert"></p>
          <span class="hint">Enter 전송 · Shift+Enter 줄바꿈</span>
          <button id="note-thread-send" class="send" type="submit" disabled>
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4 9.5 14.5M20 4l-6.5 16-4-5.5L4 10.5Z"/></svg><span>전송</span>
          </button>
        </div>
      </form>
    </main>
  </div>

  <noscript>상상톡을 쓰려면 JavaScript가 필요합니다.</noscript>

  <dialog id="chooser" aria-labelledby="chooser-title">
    <form method="dialog">
      <h2 id="chooser-title"></h2>
      <p id="chooser-role" class="dialog-sub"></p>
      <p class="lede">이 사람과 어떻게 이야기할까요?</p>
      <div class="chooser-actions">
        <button type="button" id="chooser-talk" class="button-primary">대화</button>
        <button type="button" id="chooser-note" class="button-primary">쪽지</button>
        <button type="submit" id="chooser-close" class="button-ghost">닫기</button>
      </div>
    </form>
  </dialog>
  <dialog id="note-dialog" aria-labelledby="note-title">
    <form id="note-form">
      <h2 id="note-title">쪽지</h2>
      <p id="note-target" class="dialog-sub"></p>
      <label class="sr-only" for="note-input">쪽지 내용</label>
      <textarea id="note-input" rows="3" maxlength="10000" required></textarea>
      <p id="note-error" class="alert" role="alert"></p>
      <div class="chooser-actions">
        <button type="submit" id="note-send" class="button-primary">보내기</button>
        <button type="button" id="note-cancel" class="button-ghost">닫기</button>
      </div>
    </form>
  </dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
