<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>상상톡</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="mode-login">
  <main class="gate" id="login-view">
    <form class="card" id="login-form">
      <div class="brand-row">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" class="logo-svg">
            <defs>
              <linearGradient id="login-wave" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1f8f8a"/>
                <stop offset="1" stop-color="#2f6fbe"/>
              </linearGradient>
            </defs>
            <circle cx="32" cy="32" r="30" fill="url(#login-wave)"/>
            <path d="M6 36c8-10 14-10 22 0s14 10 22 0 12-8 14-4v28H6Z" fill="#fff"/>
            <circle cx="46" cy="18" r="5" fill="#3db84a"/>
          </svg>
        </span>
        <div>
          <p class="brand">상상톡</p>
          <p class="brand-sub">음성군</p>
        </div>
      </div>
      <h1>로그인</h1>
      <p class="lede">이메일과 비밀번호로 들어옵니다.</p>
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required placeholder="name@localhost.localdomain">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="alert" role="alert"></p>
      <button id="login-button" class="button-primary" type="submit">로그인</button>
    </form>
  </main>

  <div class="shell" id="chat-view" hidden>
    <aside class="rail">
      <button type="button" class="brand-lockup" id="home-brand" data-view="home">
        <span class="logo logo-small" aria-hidden="true">
          <svg viewBox="0 0 64 64" class="logo-svg">
            <defs>
              <clipPath id="emblem-sm"><circle cx="32" cy="32" r="31"/></clipPath>
            </defs>
            <g clip-path="url(#emblem-sm)">
              <rect width="64" height="64" fill="#0c5ea6"/>
              <path fill="#1a9a92" d="M0 38c10 10 22 12 34 6 10-5 20-4 30 2v22H0Z"/>
              <path fill="#fff" d="M0 30c8-6 14 8 26 4 10-4 14-12 26-6 4 2 8 4 12 3v10c-6 1-10-2-16-4-12-4-14 10-26 8C12 43 6 36 0 42Z"/>
              <circle cx="42" cy="16" r="5.2" fill="#f0a04a"/>
            </g>
          </svg>
        </span>
        <span class="brand">상상톡</span>
      </button>
      <div class="county">
        <span class="logo logo-large" aria-hidden="true">
          <svg viewBox="0 0 64 64" class="logo-svg">
            <defs>
              <clipPath id="emblem-lg"><circle cx="32" cy="32" r="31"/></clipPath>
            </defs>
            <g clip-path="url(#emblem-lg)">
              <rect width="64" height="64" fill="#0c5ea6"/>
              <path fill="#1a9a92" d="M0 38c10 10 22 12 34 6 10-5 20-4 30 2v22H0Z"/>
              <path fill="#fff" d="M0 30c8-6 14 8 26 4 10-4 14-12 26-6 4 2 8 4 12 3v10c-6 1-10-2-16-4-12-4-14 10-26 8C12 43 6 36 0 42Z"/>
              <circle cx="42" cy="16" r="5.2" fill="#f0a04a"/>
            </g>
          </svg>
        </span>
        <p class="county-name">음성군</p>
      </div>
      <div class="me-card">
        <span id="me-avatar" class="avatar turtle-avatar" aria-hidden="true"></span>
        <span class="me-copy">
          <span id="me-name" class="who"></span>
          <span class="online-line"><span class="online-dot" aria-hidden="true"></span><span id="me-mail">온라인</span></span>
        </span>
      </div>
      <nav class="rail-nav" aria-label="메뉴">
        <button type="button" class="nav-item" id="rail-orders" disabled aria-current="page">
          <span class="nav-ico" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24"><rect x="6" y="3.8" width="12" height="16.4" rx="2"/><path d="M9 8.5h6M9 12h6M9 15.5h4"/></svg></span>
          <span>지시사항</span>
        </button>
        <button type="button" class="nav-item" disabled>
          <span class="nav-ico" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24"><path d="M9 7h10M9 12h10M9 17h10"/><path d="M5 7h.01M5 12h.01M5 17h.01" stroke-width="2.8"/></svg></span>
          <span>브리핑</span>
        </button>
        <button type="button" class="nav-item" disabled>
          <span class="nav-ico" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24"><path d="M9 18h6M10.2 21h3.6"/><path d="M12 3.4a5.4 5.4 0 0 0-3.1 9.8c.6.6 1 1.4 1 2.2h4.2c0-.8.4-1.6 1-2.2A5.4 5.4 0 0 0 12 3.4Z"/></svg></span>
          <span>AI요약</span>
        </button>
      </nav>
      <div class="rail-foot">
        <button type="button" class="nav-item" disabled>
          <span class="nav-ico" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M10.2 2.8h3.6l.4 2.2a6.6 6.6 0 0 1 1.6.9l2.1-1.2 2.5 2.5-1.2 2.1a6.6 6.6 0 0 1 .9 1.6l2.2.4v3.6l-2.2.4a6.6 6.6 0 0 1-.9 1.6l1.2 2.1-2.5 2.5-2.1-1.2a6.6 6.6 0 0 1-1.6.9l-.4 2.2h-3.6l-.4-2.2a6.6 6.6 0 0 1-1.6-.9l-2.1 1.2-2.5-2.5 1.2-2.1a6.6 6.6 0 0 1-.9-1.6l-2.2-.4V11l2.2-.4a6.6 6.6 0 0 1 .9-1.6L6.1 6.9l2.5-2.5 2.1 1.2a6.6 6.6 0 0 1 1.6-.9l.4-2.2z"/></svg></span>
          <span>설정</span>
        </button>
        <button id="logout" class="nav-item logout" type="button">
          <span class="nav-ico" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24"><path d="M10 7V5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4v-2"/><path d="M10 12h9"/><path d="M16 8.5 19.5 12 16 15.5"/></svg></span>
          <span>로그아웃</span>
        </button>
      </div>
    </aside>
    <section class="stage">
      <nav class="icon-row" aria-label="바로가기">
        <button type="button" disabled>
          <span class="icon-glyph" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="2.2"/><circle cx="15.6" cy="8.6" r="1.8"/><path d="M4.6 18.2c.5-2.6 2.3-3.9 4.4-3.9s3.9 1.3 4.4 3.9"/><path d="M13.4 14.8c1-.5 2.3-.6 3.3.1 1 .8 1.6 1.9 1.9 3.3"/></svg></span>
          <span>그룹</span>
        </button>
        <button type="button" id="nav-people" class="tone-teal" disabled>
          <span class="icon-glyph" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24"><circle cx="10" cy="8" r="2.4"/><path d="M5 18.4c.6-2.8 2.5-4.1 5-4.1s4.4 1.3 5 4.1"/><circle cx="17.2" cy="9" r="1.7"/><path d="M15.2 14.6c.9-.4 1.9-.3 2.7.4.7.6 1.1 1.5 1.3 2.6"/></svg></span>
          <span>전체직원</span>
        </button>
        <button type="button" id="nav-notes" class="tone-teal" data-view="notes">
          <span class="icon-glyph" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 5.2L20 7"/><path d="m9 13 1.8 1.8 3.6-3.6"/></svg></span>
          <span>메시지함</span>
        </button>
        <button type="button" id="nav-talk" data-view="talk">
          <span class="icon-glyph" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24"><path d="M5 6.2h11.2A2.3 2.3 0 0 1 18.5 8.5v6.1a2.3 2.3 0 0 1-2.3 2.3H10l-3.4 2.7v-2.7H5a2.3 2.3 0 0 1-2.3-2.3V8.5A2.3 2.3 0 0 1 5 6.2Z"/><path d="M8 11.6h7"/></svg></span>
          <span>대화함</span>
        </button>
        <button type="button" disabled>
          <span class="icon-glyph" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24"><path d="m12 3.4 2.5 5.2 5.7.6-4.3 3.8 1.3 5.6L12 16 6.8 18.6l1.3-5.6L3.8 9.2l5.7-.6Z"/></svg></span>
          <span>즐겨찾기</span>
        </button>
      </nav>
      <div id="home" class="home">
        <div class="search-row">
          <div class="search-box">
            <label class="sr-only" for="staff-search">직원 검색</label>
            <svg class="search-ico line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.2"/><path d="m14.4 14.4 4.2 4.2"/></svg>
            <input id="staff-search" type="search" placeholder="이름, 부서, 직책 검색" autocomplete="off">
            <button type="button" class="search-sort" disabled aria-label="정렬">
              <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="1.7" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="11" cy="17" r="1.7" fill="currentColor" stroke="none"/></svg>
            </button>
          </div>
        </div>
        <div class="staff-head">
          <h2 id="staff-count">전체 직원</h2>
          <button type="button" class="rank-button" disabled>직제순
            <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p id="staff-status" class="note-status" role="status"></p>
        <div id="staff-list" class="staff-list"></div>
        <section class="today" aria-label="오늘의 주요 메뉴">
          <h2>오늘의 주요 메뉴</h2>
          <div class="menu-cards">
            <button type="button" class="menu-card" disabled>
              <span class="card-art" aria-hidden="true">
                <svg viewBox="0 0 56 56">
                  <defs>
                    <linearGradient id="g-doc" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0" stop-color="#2fbfb0"/>
                      <stop offset="1" stop-color="#128f86"/>
                    </linearGradient>
                  </defs>
                  <rect width="56" height="56" rx="14" fill="url(#g-doc)"/>
                  <rect x="16" y="12" width="24" height="32" rx="3" fill="#fff"/>
                  <path d="M21 20h14M21 26h14M21 32h9" stroke="#14988f" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              <span><strong>지시사항</strong><small>새로운 지시 3건</small></span>
            </button>
            <button type="button" class="menu-card" disabled>
              <span class="card-art" aria-hidden="true">
                <svg viewBox="0 0 56 56">
                  <rect width="56" height="56" rx="14" fill="#e7f6f8"/>
                  <path d="M8 16h22a6 6 0 0 1 6 6v8a6 6 0 0 1-6 6H18l-6 5v-5H8a6 6 0 0 1-6-6v-8a6 6 0 0 1 6-6z" fill="#7ed3e0"/>
                  <path d="M20 22h24a6 6 0 0 1 6 6v8a6 6 0 0 1-6 6H32l-6 5v-5h-6a6 6 0 0 1-6-6v-8a6 6 0 0 1 6-6z" fill="#149eb4"/>
                </svg>
              </span>
              <span><strong>브리핑</strong><small>오늘 브리핑 1건</small></span>
            </button>
            <button type="button" class="menu-card" disabled>
              <span class="card-art" aria-hidden="true">
                <svg viewBox="0 0 56 56">
                  <defs>
                    <linearGradient id="g-ai" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0" stop-color="#5aa7f5"/>
                      <stop offset="1" stop-color="#2f6fe0"/>
                    </linearGradient>
                  </defs>
                  <rect width="56" height="56" rx="14" fill="url(#g-ai)"/>
                  <path d="M28 11a9.5 9.5 0 0 0-5.6 17.1c.7 1 .9 1.6.9 2.4v1.7h9.4v-1.7c0-.8.2-1.4.9-2.4A9.5 9.5 0 0 0 28 11z" fill="#fff"/>
                  <path d="M24.2 34.6h7.6M25 37.4h6M25.8 40.1h4.4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
                  <path d="m44 8.5 1.2 2.6 2.6 1.2-2.6 1.2-1.2 2.6-1.2-2.6-2.6-1.2 2.6-1.2z" fill="#fff"/></svg>
              </span>
              <span><strong>AI 요약</strong><small>AI가 요약한 주요업무</small></span>
            </button>
          </div>
        </section>
      </div>
      <div id="work" class="split" hidden>
        <div class="list-pane" id="list-pane">
          <div id="talk" class="pane" hidden><div id="talk-list"></div></div>
          <div id="notes" class="pane" hidden>
            <div class="filters" role="group" aria-label="쪽지 필터">
              <button type="button" data-note-filter="all" aria-pressed="true">전체</button>
              <button type="button" data-note-filter="received" aria-pressed="false">받은 쪽지</button>
              <button type="button" data-note-filter="sent" aria-pressed="false">보낸 쪽지</button>
            </div>
            <div id="notes-list"></div>
          </div>
          <div id="directory" class="pane" hidden>
            <p id="directory-status" class="note-status" role="status"></p>
            <div id="directory-list" data-state="loading"></div>
          </div>
        </div>
        <div class="thread-pane" id="thread-pane">
          <header class="thread-head">
            <button type="button" id="thread-back" class="button-ghost">목록</button>
            <div class="identity">
              <p class="channel-kicker" id="channel-kicker">대화함</p>
              <h1 id="channel-name">대화함</h1>
            </div>
            <p id="live-status" class="live" role="status">연결하는 중…</p>
            <button type="button" id="nav-general" class="button-ghost" data-view="general"># general</button>
          </header>
          <p id="history-note" class="history-note" hidden>최근 100개의 메시지만 표시합니다.</p>
          <p id="thread-empty" class="thread-empty">왼쪽에서 대화를 선택하세요.</p>
          <div id="log" class="log" role="log" aria-label="대화" data-state="loading" hidden></div>
          <div id="note-log" class="log" role="log" aria-label="쪽지" hidden></div>
          <form id="composer" class="composer" hidden>
            <label class="sr-only" for="composer-input">메시지</label>
            <textarea id="composer-input" rows="1" maxlength="10000" placeholder="메시지를 입력하세요" required></textarea>
            <button id="send-button" class="button-primary" type="submit">전송</button>
            <p id="send-error" class="alert" role="alert"></p>
          </form>
          <form id="note-composer" class="composer" hidden>
            <label class="sr-only" for="note-thread-input">쪽지</label>
            <textarea id="note-thread-input" rows="1" maxlength="10000" placeholder="쪽지를 입력하세요" required></textarea>
            <button id="note-thread-send" class="button-primary" type="submit">전송</button>
            <p id="note-thread-error" class="alert" role="alert"></p>
          </form>
        </div>
      </div>
    </section>
  </div>

  <noscript>상상톡을 쓰려면 JavaScript가 필요합니다.</noscript>

  <dialog id="chooser" aria-labelledby="chooser-title">
    <form method="dialog">
      <h2 id="chooser-title"></h2>
      <p id="chooser-role"></p>
      <p class="lede">이 사람과 어떻게 이야기할까요?</p>
      <div class="chooser-actions">
        <button type="button" id="chooser-talk" class="button-primary">대화</button>
        <button type="button" id="chooser-note" class="button-primary">쪽지</button>
        <button type="submit" id="chooser-close" class="button-ghost">닫기</button>
      </div>
    </form>
  </dialog>
  <dialog id="note-dialog" aria-labelledby="note-title">
    <form id="note-form">
      <h2 id="note-title">쪽지</h2>
      <p id="note-target"></p>
      <label class="sr-only" for="note-input">쪽지 내용</label>
      <textarea id="note-input" rows="3" maxlength="10000" required></textarea>
      <p id="note-error" class="alert" role="alert"></p>
      <div class="chooser-actions">
        <button type="submit" id="note-send" class="button-primary">전송</button>
        <button type="button" id="note-cancel" class="button-ghost">닫기</button>
      </div>
    </form>
  </dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
