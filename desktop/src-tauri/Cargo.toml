[package]
name = "sangsangtalk-desktop"
version = "0.1.0"
description = "SangsangTalk Windows shell"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "sangsangtalk_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
url = "=2.5.8"

[dependencies]
tauri = { version = "=2.12.5", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.5"
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
# SChannel: TLS for the status check, trusting the Windows certificate store.
native-tls = "=0.2.18"
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }
