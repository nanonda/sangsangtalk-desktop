[package]
name = "sangsangtalk-desktop"
version = "0.1.0"
description = "SangsangTalk Windows shell"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "sangsangtalk_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
url = "=2.5.8"
